<!-- Notification Container - Fixed position top-right with highest z-index -->
<div class="notification-container fixed top-4 right-4 flex flex-col space-y-2 max-w-sm w-full">
  @for (notification of notifications; track notification.id) {
  <app-notification
    [notification]="notification"
    (close)="onNotificationClose($event)"
    (actionClick)="onNotificationActionClick($event)"
  />
  }
</div>

<!-- Notification Container Styles -->
<style>
  :host {
    /* Ensure the container doesn't interfere with page layout */
    position: fixed;
    top: 0;
    right: 0;
    pointer-events: none;
    z-index: 9999 !important; /* Increased z-index with !important */
  }

  /* Allow pointer events on the actual notification container */
  .fixed {
    pointer-events: auto;
  }

  /* Responsive behavior for smaller screens */
  @media (max-width: 640px) {
    .fixed {
      top: 1rem;
      right: 1rem;
      left: 1rem;
      max-width: none;
    }
  }

  /* Additional styles to ensure notifications appear above auth layout */
  .notification-container {
    position: relative !important;
    z-index: 10000 !important;
  }
</style>
